services:
  postgres:
    image: postgres:16
    container_name: cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema_booking
    ports:
      - '5432:5432'
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cinema-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  mailpit:
    image: axllent/mailpit:latest
    container_name: cinema-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  cinema_postgres_data:
